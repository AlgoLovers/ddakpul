# 딱풀 버전 단일 소스(Single Source of Truth). build.gradle.kts가 이 파일만 읽는다.
#
# 철칙:
#  - VERSION_CODE: 단조증가 정수. Play에 올리는 빌드마다 +1. 절대 재사용·되돌리기 금지.
#                  모든 트랙(내부/비공개/프로덕션)이 이 번호 공간을 공유한다(트랙별 아님).
#  - VERSION_NAME: 사용자에게 보이는 SemVer. 기능=MINOR, 버그=PATCH, 공개출시 때 1.0.
#  - 릴리스는 /release 스킬로. 규칙 전문은 docs/RELEASE.md.
VERSION_CODE=16
VERSION_NAME=0.5.1
